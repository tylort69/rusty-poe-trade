[workspace]
resolver = "3"
members = ["crates/*", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OWNER/rusty-poe-trade"
authors = ["Rusty POE Trade contributors"]
rust-version = "1.88"

[workspace.dependencies]
rpt-data = { path = "crates/rpt-data" }
rpt-parser = { path = "crates/rpt-parser" }
rpt-trade = { path = "crates/rpt-trade" }
rpt-stash = { path = "crates/rpt-stash" }
rpt-platform = { path = "crates/rpt-platform" }
rpt-m3 = { path = "crates/rpt-m3" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.20"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
fnv = "1"
strsim = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
directories = "6"
rust-ini = "0.21"
notify = "8"

eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "accesskit", "clipboard", "links"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["image", "http", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
material-colors = "0.5"

global-hotkey = "0.10"
rdev = "0.5"
enigo = "0.6"
arboard = "3"
tray-icon = "0.26"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
